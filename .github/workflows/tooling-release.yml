name: Release shared tooling
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run, first release with NPM_TOKEN, or trusted OIDC release
        type: choice
        options: [dry-run, bootstrap, trusted]
        default: dry-run
        required: true
permissions:
  contents: read
concurrency:
  group: npm-tooling-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publication ref
        run: |
          if [ "$RELEASE_MODE" != dry-run ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Publication requires the main branch.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci
      - run: npm run test --workspace @motionstudies/tooling
      - run: npm run check:packed --workspace @motionstudies/tooling > tooling-verification.log
      - name: Retain verified tarball
        run: |
          mkdir -p .package-dist/tooling-release
          node --input-type=module <<'JS'
          import { readFile, cp } from 'node:fs/promises'
          const log = await readFile('tooling-verification.log', 'utf8')
          const receipt = JSON.parse(log.slice(log.lastIndexOf('\n{')))
          await cp(receipt.tarball, '.package-dist/tooling-release/tooling.tgz')
          await cp(receipt.tarball.replace(/[^/]+$/, 'receipt.json'), '.package-dist/tooling-release/receipt.json')
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: verified-tooling
          path: .package-dist/tooling-release/
          if-no-files-found: error
  publish:
    if: inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: verified-tooling
      - name: Verify candidate identity
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          if (createHash('sha256').update(await readFile('tooling.tgz')).digest('hex') !== receipt.sha256) throw new Error('Tarball digest mismatch')
          JS
      - name: Bootstrap publication
        if: inputs.mode == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Bootstrap requires the NPM_TOKEN secret in the npm GitHub environment.' >&2
            exit 1
          fi
          npm publish tooling.tgz --access public --provenance --tag next
      - name: Trusted publication
        if: inputs.mode == 'trusted'
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish tooling.tgz --access public --provenance --tag next
      - name: Verify registry bytes
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          const response = await fetch('https://registry.npmjs.org/@motionstudies%2ftooling/' + receipt.version)
          if (!response.ok) throw new Error('Registry version unavailable')
          const release = await response.json()
          if (release.dist.integrity !== receipt.integrity) throw new Error('Registry integrity mismatch')
          const bytes = new Uint8Array(await (await fetch(release.dist.tarball)).arrayBuffer())
          const { createHash } = await import('node:crypto')
          if (createHash('sha256').update(bytes).digest('hex') !== receipt.sha256) throw new Error('Registry bytes mismatch')
          JS
