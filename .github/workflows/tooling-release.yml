name: Release shared tooling
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify, stage, publish, or promote the verified release to latest
        type: choice
        options: [dry-run, stage, bootstrap, trusted, verify-registry, promote-latest]
        default: dry-run
        required: true
permissions:
  contents: read
concurrency:
  group: npm-tooling-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publication ref
        run: |
          if [ "$RELEASE_MODE" != dry-run ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Publication requires the main branch.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci
      - run: npm run format:check --workspace @motionstudies/tooling
      - run: npm run test --workspace @motionstudies/tooling
      - run: npm run check:packed --workspace @motionstudies/tooling > tooling-verification.log
      - name: Retain verified tarball
        run: |
          mkdir -p .package-dist/tooling-release
          node --input-type=module <<'JS'
          import { readFile, cp } from 'node:fs/promises'
          const log = await readFile('tooling-verification.log', 'utf8')
          const receipt = JSON.parse(log.slice(log.lastIndexOf('\n{')))
          await cp(receipt.tarball, '.package-dist/tooling-release/tooling.tgz')
          await cp(receipt.tarball.replace(/[^/]+$/, 'receipt.json'), '.package-dist/tooling-release/receipt.json')
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: verified-tooling
          path: .package-dist/tooling-release/
          if-no-files-found: error
  publish:
    if: inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: verified-tooling
      - name: Verify candidate identity
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          if (createHash('sha256').update(await readFile('tooling.tgz')).digest('hex') !== receipt.sha256) throw new Error('Tarball digest mismatch')
          JS
      - name: Bootstrap publication
        if: inputs.mode == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Bootstrap requires the NPM_TOKEN secret in the npm GitHub environment.' >&2
            exit 1
          fi
          npm publish tooling.tgz --access public --provenance --tag next
      - name: Stage publication and verify stored bytes
        if: inputs.mode == 'stage'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Staging requires NPM_TOKEN.' >&2
            exit 1
          fi
          npm stage publish tooling.tgz --access public --provenance --tag next --json > stage.json
          node --input-type=module <<'JS'
          import { readFile, readdir, appendFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const result = JSON.parse(await readFile('stage.json', 'utf8'))['@motionstudies/tooling']
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          if (!/^[\da-f]{8}-(?:[\da-f]{4}-){3}[\da-f]{12}$/i.test(result?.stageId ?? '')) throw new Error('Missing stage identity')
          if (result.version !== receipt.version || result.integrity !== receipt.integrity) throw new Error('Staged identity mismatch')
          execFileSync('npm', ['stage', 'download', result.stageId], { stdio: 'inherit' })
          const files = (await readdir('.')).filter(name => name.endsWith(`-${result.stageId}.tgz`))
          if (files.length !== 1) throw new Error('Missing staged tarball')
          if (createHash('sha256').update(await readFile(files[0])).digest('hex') !== receipt.sha256) throw new Error('Staged bytes mismatch')
          const summary = `Staged @motionstudies/tooling@${receipt.version} with byte-for-byte verification.\n\nStage ID: ${result.stageId}\n\nA maintainer must approve this stage on npm with 2FA before this version becomes installable.\n`
          console.log(summary)
          await appendFile(process.env.GITHUB_STEP_SUMMARY, summary)
          JS
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'stage'
        with:
          name: staged-tooling
          path: |
            stage.json
            receipt.json
          if-no-files-found: error
      - name: Trusted publication
        if: inputs.mode == 'trusted'
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish tooling.tgz --access public --provenance --tag next --loglevel verbose
      - name: Verify registry bytes
        if: inputs.mode != 'stage'
        timeout-minutes: 10
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          import { setTimeout as delay } from 'node:timers/promises'
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          async function available(url) {
            for (let attempt = 0; attempt < 20; attempt++) {
              const fresh = new URL(url)
              fresh.searchParams.set('verify', `${Date.now()}-${attempt}`)
              let response
              try { response = await fetch(fresh, { signal: AbortSignal.timeout(15_000) }) } catch {}
              if (response?.ok) return response
              if (response && response.status !== 404 && response.status !== 429 && response.status < 500) throw new Error(`Registry HTTP ${response.status}`)
              if (attempt < 19) {
                console.log(`Waiting for npm registry processing (attempt ${attempt + 1})`)
                await delay(15_000)
              }
            }
            throw new Error('Registry processing did not complete')
          }
          const release = await (await available('https://registry.npmjs.org/@motionstudies%2ftooling/' + receipt.version)).json()
          if (release.name !== '@motionstudies/tooling' || release.version !== receipt.version) throw new Error('Registry identity mismatch')
          if (release.dist.integrity !== receipt.integrity) throw new Error('Registry integrity mismatch')
          const bytes = new Uint8Array(await (await available(release.dist.tarball)).arrayBuffer())
          if (createHash('sha256').update(bytes).digest('hex') !== receipt.sha256) throw new Error('Registry bytes mismatch')
          console.log(`Verified @motionstudies/tooling@${receipt.version}: registry bytes match the tested tarball.`)
          JS
      - name: Promote verified release to latest
        if: inputs.mode == 'promote-latest'
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          import { setTimeout as delay } from 'node:timers/promises'
          const receipt = JSON.parse(await readFile('receipt.json', 'utf8'))
          async function tags() {
            const response = await fetch(`https://registry.npmjs.org/@motionstudies%2ftooling?verify=${Date.now()}`, { signal: AbortSignal.timeout(15_000) })
            if (!response.ok) throw new Error(`Registry HTTP ${response.status}`)
            return (await response.json())['dist-tags']
          }
          const before = await tags()
          execFileSync('npm', ['dist-tag', 'add', `@motionstudies/tooling@${receipt.version}`, 'latest'], { stdio: 'inherit' })
          for (let attempt = 0; attempt < 12; attempt++) {
            const current = await tags()
            if (current.latest === receipt.version) {
              if (current.next !== before.next) throw new Error('Unexpected next tag change')
              const summary = `Verified latest: ${before.latest} -> ${current.latest}; next: ${current.next}\n`
              console.log(summary)
              await appendFile(process.env.GITHUB_STEP_SUMMARY, summary)
              process.exit(0)
            }
            await delay(5_000)
          }
          throw new Error('Registry latest tag did not propagate')
          JS
