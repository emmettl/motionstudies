name: Check shared tooling
on:
  push:
    branches: [main]
    paths: ['packages/tooling/**', 'package.json', 'package-lock.json', '.github/workflows/tooling-*.yml']
  pull_request:
    paths: ['packages/tooling/**', 'package.json', 'package-lock.json', '.github/workflows/tooling-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: npm ci
      - run: npm run format:check --workspace @motionstudies/tooling
      - run: npm run test --workspace @motionstudies/tooling
      - run: npm run check:packed --workspace @motionstudies/tooling
